<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D91E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>A-Star Industry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{--red:#D91E2E;--red-d:#B0131F;--red-bg:#FDE9EB;--ink:#23262B;--mut:#6B7077;--line:#E4DFDD;--bg:#F6F3F2;--surf:#fff;--surf2:#F0ECEA;--ok:#17703A;--ok-bg:#E3F4E9;--warn:#9A5B00;--warn-bg:#FFF1D6;--info:#1B5FA8;--info-bg:#E4EFFB;--bad:#B3261E;--bad-bg:#FDE7E5;--r:14px;--nav:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--red:#F2495A;--red-d:#D91E2E;--red-bg:#3A1A1E;--ink:#F1EEED;--mut:#A39EA0;--line:#3A3537;--bg:#171415;--surf:#221E20;--surf2:#2C2729;--ok:#57C783;--ok-bg:#16301F;--warn:#F0B34A;--warn-bg:#3A2C10;--info:#7FB4F0;--info-bg:#14283F;--bad:#FF8A82;--bad-bg:#3D1B19}}
:root[data-theme=dark]{--red:#F2495A;--red-d:#D91E2E;--red-bg:#3A1A1E;--ink:#F1EEED;--mut:#A39EA0;--line:#3A3537;--bg:#171415;--surf:#221E20;--surf2:#2C2729;--ok:#57C783;--ok-bg:#16301F;--warn:#F0B34A;--warn-bg:#3A2C10;--info:#7FB4F0;--info-bg:#14283F;--bad:#FF8A82;--bad-bg:#3D1B19}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam",sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hdr{position:sticky;top:0;z-index:20;background:var(--surf);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:10px}
.hdr img{height:44px;width:auto;display:block}
.hdr .ttl{flex:1;min-width:0}
.hdr .ttl b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{color:var(--mut);font-size:11.5px}
.ibtn{border:1px solid var(--line);background:var(--surf);border-radius:10px;min-width:38px;height:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.wrap{padding:12px 14px;max-width:760px;margin:0 auto}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card h3{font-size:15px;margin-bottom:6px}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:16px 2px 8px}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surf2);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.red{background:var(--red);color:#fff}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:12px;min-height:44px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=password],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);position:relative}
.nav button.on{color:var(--red)}
.nav svg{width:24px;height:24px}
.nav .dot{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:18px;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:90;max-width:90vw;font-size:14px}
.alertbar{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:var(--info-bg);color:var(--info);font-weight:600}
.alertbar.urgent{background:var(--red);color:#fff}
.alertbar .x{margin-left:auto;border:0;background:rgba(0,0,0,.15);color:inherit;border-radius:8px;min-width:32px;height:32px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pc img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block}
.pc .in{padding:8px 10px;display:grid;gap:3px}
.pc .code{font-size:11.5px;font-weight:800;color:var(--red)}
.pc .nm{font-weight:700;font-size:14px;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:20px;display:block;margin-top:2px}
.kpi.red{background:var(--red);border-color:var(--red);color:#fff}.kpi.red small{color:#fbd}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{background:linear-gradient(135deg,#23262B,#3a3f47 60%,#D91E2E);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.hero small{opacity:.8}
.hero b{font-size:22px;display:block}
.bars{display:grid;gap:8px}
.bar .t{height:9px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:3px}
.bar .t i{display:block;height:100%;background:var(--red);border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px}
.cols .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cols .c i{display:block;width:100%;background:var(--red);border-radius:5px 5px 1px 1px;min-height:2px}
.cols .c span{font-size:9.5px;color:var(--mut);margin-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--mut);text-transform:uppercase}
.tbl td.r,.tbl th.r{text-align:right}
.lines .ln{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.lines .ln img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1/1;border-radius:10px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative}
.cal .h{font-size:10.5px;color:var(--mut);text-align:center;font-weight:700}
.cal .d.P{background:var(--ok-bg);color:var(--ok)}.cal .d.A{background:var(--bad-bg);color:var(--bad)}.cal .d.H{background:var(--warn-bg);color:var(--warn)}.cal .d.F{background:var(--info-bg);color:var(--info)}.cal .d.L{background:var(--surf2);color:var(--mut)}
.cal .d small{font-size:9px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surf);padding:8px 4px;font-weight:700;font-size:13px;min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:22px}
#login img.lg{width:190px;display:block;margin:0 auto 6px}
#login .err{color:var(--bad);font-weight:600;min-height:20px;margin:6px 0}
.demo{margin-top:10px;font-size:13px;text-align:center}
.lsw{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
@media print{.nav,.hdr{display:none}}
</style>
</head>

function bootFirebase() {

      }).catch(function () {
        var t = null; try { t = JSON.parse(localStorage.getItem(ck) || 'null'); } catch (e) { /* */ }

function nextNo(prefix, col, field, width) {

  return prefix + String(mx + 1).padStart(width || 4, '0');
}
function prodOf(id) { return byId('products', id); }

function lineInStock(l) { return !l.custom && l.pid && stockOf(l.pid) >= num(l.qty); }
function allInStock(o) { return !!(o.lines && o.lines.length) && o.lines.every(lineInStock); }
function pimg(code, photo) { return photo || ('img/' + String(code || '').replace('-', '') + '.jpg'); }

function itemsSummary(o, n) {

  return a.slice(0, n || 2).join(', ') + (a.length > (n || 2) ? ' +' + (a.length - (n || 2)) : '');

function docTotals(d) {
  var sub = 0; (d.lines || []).forEach(function (l) { sub += num(l.qty) * num(l.rate); });
  sub = r2(sub); var disc = Math.min(sub, r2(num(d.discount))), taxable = r2(sub - disc), tax = 0;
  if (d.gstOn && sub > 0) (d.lines || []).forEach(function (l) { var a = num(l.qty) * num(l.rate); tax += a * (1 - disc / sub) * num(l.gst) / 100; });
  tax = r2(tax);
  var cg = 0, sg = 0, ig = 0; if (d.gstOn) { if (d.gstType === 'igst') ig = tax; else { cg = r2(tax / 2); sg = r2(tax - cg); } }
  var raw = r2(taxable + tax), total = Math.round(raw);
  return { sub: sub, disc: disc, taxable: taxable, tax: tax, cgst: cg, sgst: sg, igst: ig, raw: raw, round: r2(total - raw), total: total };
}
function paidOf(d) { return r2((d.payments || []).reduce(function (s, p) { return s + num(p.amount); }, 0)); }
function invBalance(d) { return r2(docTotals(d).total - paidOf(d)); }

}
var ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'], TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function w99(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : ''); }
function w999(n) { return (n >= 100 ? ONES[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '') + (n % 100 ? w99(n % 100) : ''); }
function numWords(n) {

}
